[project]
name = "resolve-ext"
version = "1.0.5"
description = "MCP server adding the DaVinci Resolve scripting surfaces mainstream MCP servers do not cover"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["davinci-resolve", "mcp", "model-context-protocol", "video-editing", "blackmagic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    # mcp 2.x breaks FastMCP, so the pin matters.
    "mcp[cli]>=1.30,<2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/CaptRauti/ResolveMCP-ext"
Repository = "https://github.com/CaptRauti/ResolveMCP-ext"
Issues = "https://github.com/CaptRauti/ResolveMCP-ext/issues"
Changelog = "https://github.com/CaptRauti/ResolveMCP-ext/releases"

[project.scripts]
resolve-ext = "server:main"

[tool.setuptools]
py-modules = ["server"]

