[project]
name = "resolve-ext"
version = "0.1.0"
description = "MCP server adding the DaVinci Resolve 21.1.2 scripting surfaces mainstream MCP servers do not cover"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["davinci-resolve", "mcp", "model-context-protocol", "video-editing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    # mcp 2.x breaks FastMCP, so the pin matters.
    "mcp[cli]>=1.30,<2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
resolve-ext = "server:mcp.run"

[tool.setuptools]
py-modules = ["server"]
